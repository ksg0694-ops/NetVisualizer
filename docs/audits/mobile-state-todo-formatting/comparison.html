<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Todo mobile before and after</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 20px; background: #e5e7eb; color: #111827; font: 14px/1.4 system-ui, sans-serif; }
        main { display: grid; grid-template-columns: repeat(2, 390px); gap: 16px; width: max-content; margin: 0 auto; }
        figure { margin: 0; overflow: hidden; border: 1px solid #cbd5e1; border-radius: 12px; background: white; box-shadow: 0 8px 24px rgba(15, 23, 42, .08); }
        figcaption { padding: 10px 12px; border-bottom: 1px solid #e5e7eb; font-weight: 700; }
        img { display: block; width: 390px; height: 844px; object-fit: cover; object-position: top; }
    </style>
</head>
<body>
    <main>
        <figure>
            <figcaption>Before · 영역색 없음</figcaption>
            <img src="./01-before-mobile-list.png" alt="수정 전 모바일 할 일 목록">
        </figure>
        <figure>
            <figcaption>After · 영역별 카드 색상</figcaption>
            <img src="./03-after-colored-mobile-list.png" alt="수정 후 모바일 할 일 목록">
        </figure>
    </main>
</body>
</html>
